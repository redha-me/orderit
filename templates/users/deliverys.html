{%extends "base.html"%}
{% load static  i18n %}
{%block page_name%}
{% trans "Deliverys" %}
{%endblock page_name%}

{%block content%}
{% if status == 1 or status == 2 or status == 3 %}

  <div id='map'></div> 
  <div 
  id='htmx'
  hx-post="{% url 'users:update' %}"
  hx-trigger="every 4s"
  hx-swap="innerHTML" 
  hx-target='.target2'
>
    <button  id='button'type="button" class="  w-full flex  justify-center py-2.5 px-5 mr-2 mb-2 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-sm border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-200  "><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 11l7-7 7 7M5 19l7-7 7 7" />
      </svg></button>
      <div id="body" class=" panel panel-success">
        <div  class="list-group" >
          <div class='target' >
          {% include 'users/status.html' %}
          
        </div>
              </div>

        </div>
      
    </div>
  <div  id='panel'class="panel panel-success" >

     <div class="panel-body">
         <div  class="list-group list-group-item" >
           <div class='target2'>
           {% include 'users/status.html' %}
           
         </div>

     </div></div>

</div>

 <script>
  function createCustomeMarker(path,Map,coordinates){
    const el = document.createElement('div');
    const width = 50;
    const height = 50;
    el.className = 'marker';
    el.style.backgroundImage =  path;
    el.style.width = `${width}px`;
    el.style.height = `${height}px`;
    el.style.backgroundSize = '100%';
    new mapboxgl.Marker(el)
    .setLngLat(coordinates)
    .addTo(Map);}
  mapboxgl.accessToken = '{{access_token}}';
  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/streets-v11',
    center: {{cutomer_address}}, // starting position
    zoom: 14
  });
  map.addControl(new mapboxgl.NavigationControl());
  
  const start = {{cutomer_address}};
  
  
  async function getRoute(end) {
      
      const query = await fetch(
        `https://api.mapbox.com/directions/v5/mapbox/driving/${start[0]},${start[1]};${end[0]},${end[1]}?steps=true&geometries=geojson&access_token=${mapboxgl.accessToken}`,
        { method: 'GET' }
      );
      const json = await query.json();
      const data = json.routes[0];
      const route = data.geometry.coordinates;
      const geojson = {
        type: 'Feature',
        properties: {},
        geometry: {
          type: 'LineString',
          coordinates: route
        }
      };
      if (map.getSource('route')) {
        map.getSource('route').setData(geojson);
      }
      else {
        map.addLayer({
          id: 'route',
          type: 'line',
          source: {
            type: 'geojson',
            data: geojson
          },
          layout: {
            'line-join': 'round',
            'line-cap': 'round'
          },
          paint: {
            'line-color': '#3887be',
            'line-width': 5,
            'line-opacity': 0.75
          }
          
        });
      }
    }
    var driver =[21.661311,68.975590];
      $(document).ready(function() {
        var lang='{{request.LANGUAGE_CODE}}';
        setInterval(function() {
          $.ajax({
           url: '/'+lang+'/users/driverPosition/',
            method: 'post',
            success: function(data) {
              if (data['driver_address'] != 0) {
               driver=data['driver_address'];
               createCustomeMarker( `url("{% static 'map_img/delivery-man.png' %}")`,map,driver);
              } 
            }
          })
        }, 6000)
      }) 
     
    map.on('load', () => {
      map.addLayer({
        id: 'point',
        type: 'circle',
        source: {
          type: 'geojson',
          data: {
            type: 'FeatureCollection',
            features: [
              {
                type: 'Feature',
                properties: {},
                geometry: {
                  type: 'Point',
                  coordinates: driver
                }
              }
            ]
          }
        },
      });
    
     
      
      getRoute(start);
       map.addLayer({
        id: 'point1',
        type: 'circle',
        source: {
          type: 'geojson',
          data: {
            type: 'FeatureCollection',
            features: [
              {
                type: 'Feature',
                properties: {},
                geometry: {
                  type: 'Point',
                  coordinates: start
                }
              }
            ]
          }
        },
      });
      createCustomeMarker( `url("{% static 'map_img/man.png' %}")`,map,start);

       
     
  
    
      
      
          const coords = {{restaurent_address}};
          getRoute(coords);
       map.addLayer({
        id: 'point2',
        type: 'circle',
        source: {
          type: 'geojson',
          data: {
            type: 'FeatureCollection',
            features: [
              {
                type: 'Feature',
                properties: {},
                geometry: {
                  type: 'Point',
                  coordinates: coords
                }
              }
            ]
          }
        },
      });
      createCustomeMarker( `url("{% static 'map_img/store.png' %}")`,map,coords);

       
       
          });
      
          var x = window.matchMedia("(max-width: 992px)");      
          function handleTabletChange(e) {
        if (e.matches) {
          document.getElementById('button').classList.remove('hidden');
          document.getElementById('body').classList.remove('hidden');
          document.getElementById('panel').classList.add('hidden');
          document.getElementById('htmx').setAttribute('hx-target', '.target');

        }
        else{
          document.getElementById('body').classList.add('hidden');
          document.getElementById('button').classList.add('hidden');
          document.getElementById('panel').classList.remove('hidden');
          document.getElementById('htmx').setAttribute('hx-target', '.target2');

        }
      }
      
      x.addListener(handleTabletChange);
      handleTabletChange(x);
    
    
                  </script> 
  
  
  
  {% endif %}
 {%endblock content%}
