{%extends "delivery_man/sidebar.html"%}




{%block content%}
{% if orders %}
<div class="mt-16 flex justify-center ">
    <div class=" flex flex-wrap justify-center py-4 mt-16   ">

        {% for order in orders %}
        <a href={% url 'delivery_man:orderPick' order.id%}>
                        <div
                        class=" relative bg-white-100 shadow-resbox hover:scale-102 hover:shadow-dishw duration-300 flex flex-col justify-center content-end h-336 mx-2 my-3 w-72  minxss:w-400  rounded-lg">
                            
                                <span class=" absolute top-4 right-0 bg-sky-500 rounded-l-md 
                                    rounded-br-lg  text-white pl-3 pr-6">
                                    <span class="font-sans font-medium text-lg tracking-wide ">DZD {{order.total}}</span>
                                </span>
                                <img  class="w-full h-240 rounded-lg object-cover" src="{{order.customer.avatar.url}}">
                                <div class="flex justify-between w-full pl-2 flex-wrap ">
                                    <span class="font-sans font-medium text-xl text-gray-500 ove">{{order.customer}}</span>

                                </div>
                                <div class="w-full px-2 font-normal text-gray-400 mb-1">
                                    <span>{{order.address.wilaya}},{{order.address.commune}}</span>
                                </div>
                               
                               
                        
                        </div>
                    </a>
                {% endfor %}
                

    </div>
</div>

{% endif %}
<script>
    var options = {
        maximumAge:10000,
        enableHighAccuracy: true,
        timeout: 5000,
        maximumAge: 0
      };
       
       function success(pos) {
         var crd = pos.coords;
          $(document).ready(function() {
                 var now = new Date();
                 setInterval(function() {
              $.ajax({
                  method:'post',
                  url:"{% url 'delivery_man:readyOrder' %}",
                  data:{
                  lat:crd.latitude,
                  long:crd.longitude,
              },});}, 3000)
                }) 

       }
       
       function error(err) {
         console.log(err)
                  }
       
       navigator.geolocation.watchPosition(success, error,options)
</script> 
{%endblock%}
