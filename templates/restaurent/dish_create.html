{% load i18n %}
<div class="grow flex  flex-col justify-end ">
    <div class="flex justify-end ">
<a data-modal-toggle="create">
       
            <svg class="w-1/5 right-8 bottom-40 motion-safe:hover:scale-110 transition ease-in-out duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
        
    </a>
</div>
</div>
<div id="create" tabindex="-1" aria-hidden="true" class=" hidden overflow-y-scroll  overflow-x-hidden fixed top-0 right-0 left-0 z-50 w-full h-full">
    <div class="absolute top-0 p-4  w-full max-w-2xl  h-fit  ">
        <!-- Modal content -->
        <div class="relative bg-white rounded-lg shadow h-fit w-full ">
            <div class="flex justify-between items-center p-5 rounded-t border-b">
                <span class="text-xl font-semibold text-gray-900  capitalize">
                   {% trans "create Dish"%}
                </span>
                <button type="button" class="text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center dark:hover:bg-gray-800 dark:hover:text-white" data-modal-toggle="create">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>  
                </button>
            </div>
            <div class="p-6 space-y-6"   >
            <form method="post"  action="{% url 'restaurent:create' %}" enctype="multipart/form-data" >
                {%csrf_token%}
                <input type="text" name="name" required="required" maxlength="200" placeholder={% trans "name"%} required="" id="id_name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 my-3">
                <textarea name="description" required="required" cols="40" rows="10" placeholder={% trans "description"%} id="id_description" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 my-3"></textarea>
                <input type="number" required="required" name="price" step="any" placeholder={% trans "price"%} required="" id="id_price" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 my-3">
                <input type="file" required="required"  name="photo" accept="image/*" placeholder="photo" maxlength="50" id="id_photo" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-600 dark:border-gray-500 dark:placeholder-gray-400 dark:text-white">
                
                <div class="w-full flex justify-center">
                    <input type="submit" value={% trans "Save"%} class="w-32 text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center my-3 "/>
                </div>           
             </form>
        </div>
    </div>
    </div>
</div>
