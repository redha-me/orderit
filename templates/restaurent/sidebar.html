{%extends "base.html"%}
{% load i18n %}
{% block script %}
 <script>
  $(document).ready(function() {
    var lang='{{request.LANGUAGE_CODE}}';
    var now = new Date();
    setInterval(function() {
      $.ajax({
       url: '/'+lang+'/restaurent/orders/notification/' + now.toISOString() + '/',
        method: 'post',
        success: function(data) {
          if (data['notification'] === 0) {
            $('.badge').text('');
          } else {
            $('.badge').text(data['notification']);
          }
        }
      })
    }, 2000)
  }) 
</script> 
{% endblock  %} 
{% block sidebar %}

<div class="fixed mt-16 w-full h-12 bg-mygray flex z-10 transition-all duration-300"
:class="{'h-0': scrollfromtop ,'h-12':!scrollfromtop}">



    <div class="w-1/3  flex justify-center  border-gray-100 text-gray-400  hover:text-sky-400 hover:bg-gray-200 duration-300">
    <button onClick="location.href='{% url 'restaurent:account'  %}'"
     class=" flex justify-center items-center  w-full h-full focus:border-b-2 focus:border-sky-500 transition-all  duration-300"
     :class="{'opacity-0 invisible': scrollfromtop ,'':!scrollfromtop}">
     <div  class="flex w-full items-center justify-center p-2   ">
          <svg class=" w-6 h-6   " fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"></path></svg>
          <span class="ml-3 text-base font-semibold" >{% trans "Account"%}</span>
        </div>
    </button>
    </div>
    <div class="w-1/3  flex justify-center  border-gray-100 text-gray-400  hover:text-sky-400 hover:bg-gray-200  duration-300">
      <button onClick="location.href='{% url 'restaurent:meals' user.pk  %}' " 
       class=" flex justify-center items-center  w-full h-full focus:border-b-2 focus:border-sky-500 transition-all  duration-300 "
       :class="{'opacity-0 invisible': scrollfromtop ,'':!scrollfromtop}">

             <svg  class=" w-6 h-6  " fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-6 3a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"></path></svg>
              <span class="ml-3 text-base font-semibold" >{% trans "Dishs"%}</span>
        </div>
      </button>
    </div>
    <div class="w-1/3  flex justify-center  border-gray-100 text-gray-400  hover:text-sky-400 hover:bg-gray-200  duration-300">
      <button onClick="location.href='{% url 'restaurent:orders'  %}'"
       class=" flex   justify-center items-center  w-full h-full focus:border-b-2 focus:border-sky-500 transition-all  duration-300" 
       :class="{'opacity-0 invisible': scrollfromtop ,'':!scrollfromtop}">
        <div class="flex w-full items-center justify-center p-2   ">
          
            <svg class=" w-6 h-6  " fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            <span class="ml-3 text-base font-semibold relative" > 
            {% trans "Orders"%}
            <span class=" badge  mt-4 p-1 absolute -top-4 -right-3 bg-indigo-500 text-white text-xs rounded-full"></span>
          </span>
            
        </div>
      </button>
    </div>

</div>
{% endblock sidebar %}
